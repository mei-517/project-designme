spring.application.name=designme-api

# Secrets (DB password etc.) live in a git-ignored file; see application-secret.properties.example
spring.config.import=optional:file:./application-secret.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/designme
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
